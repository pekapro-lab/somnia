name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.PEKAR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::PEKAR_KEYSTORE_BASE64 secret missing"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PEKAR_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests + release APK
        env:
          PEKAR_KEYSTORE_PASSWORD: ${{ secrets.PEKAR_KEYSTORE_PASSWORD }}
          PEKAR_KEY_PASSWORD: ${{ secrets.PEKAR_KEY_PASSWORD }}
          PEKAR_KEY_ALIAS: ${{ secrets.PEKAR_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon

      - name: Verify alignment + signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          $BT/zipalign -c -P 16 4 "$APK"
          $BT/apksigner verify --verbose --print-certs "$APK" | grep -E "Verified using v[123] |certificate SHA-256"
          $BT/apksigner verify --print-certs "$APK" | grep -q "668fd481c81e7c388f8f17ce8a8d5e27b951b005f32262b175d36ebe25332443" || { echo "::error::Unexpected signing certificate"; exit 1; }
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Prepare artifact
        id: prep
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION="dev"; fi
          OUT="Somnia-Binaural-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Somnia-Binaural-apk
          path: |
            ${{ steps.prep.outputs.apk }}
            ${{ steps.prep.outputs.apk }}.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="${{ steps.prep.outputs.apk }}"
          VER="${{ steps.prep.outputs.version }}"
          SUM=$(cut -d' ' -f1 "$APK.sha256")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then gh release upload "$GITHUB_REF_NAME" "$APK" --clobber; exit 0; fi
          gh release create "$GITHUB_REF_NAME" "$APK" --title "Somnia Binaural $VER" --notes "APK de Android de **Somnia Binaural**: tonos binaurales y sonidos de la naturaleza, sin conexión. Hecho con Grok.

          - Paquete: \`com.pekapro.somnia\`
          - Android 7 (API 24) o superior

          **Instalar:** descarga la APK → permite apps desconocidas → Instalar.

          No es un tratamiento médico. Usa auriculares. No lo uses conduciendo.

          SHA-256: \`$SUM\`"
